# =============================================================================
# Kubernetes Service for Medical Chatbot API
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: medical-chatbot-service
  namespace: medical-chatbot
  labels:
    app: medical-chatbot
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: medical-chatbot
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None
