# =============================================================================
# Kubernetes Secret Template for Medical Chatbot
# IMPORTANT: Replace placeholder values before deployment
# Use: kubectl create secret generic medical-chatbot-secrets --from-env-file=.env
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: medical-chatbot-secrets
  namespace: medical-chatbot
  labels:
    app: medical-chatbot
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual values or use external secret management
  SECRET_KEY: "REPLACE_WITH_STRONG_SECRET_KEY"
  MONGODB_URI: "mongodb://mongodb-service:27017"
  PINECONE_API_KEY: "REPLACE_WITH_PINECONE_API_KEY"
  PINECONE_ENVIRONMENT: "REPLACE_WITH_PINECONE_ENVIRONMENT"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"
