# =============================================================================
# Kubernetes Ingress for Medical Chatbot API
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-chatbot-ingress
  namespace: medical-chatbot
  labels:
    app: medical-chatbot
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.medical-chatbot.example.com
      secretName: medical-chatbot-tls
  rules:
    - host: api.medical-chatbot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medical-chatbot-service
                port:
                  number: 80
