# =============================================================================
# Kubernetes ConfigMap for Medical Chatbot
# Non-sensitive configuration values
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: medical-chatbot-config
  namespace: medical-chatbot
  labels:
    app: medical-chatbot
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "WARNING"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  MONGODB_DATABASE: "medical_chatbot"
  MONGODB_MIN_POOL_SIZE: "10"
  MONGODB_MAX_POOL_SIZE: "50"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  WORKERS: "4"
  HOST: "0.0.0.0"
  PORT: "8080"
